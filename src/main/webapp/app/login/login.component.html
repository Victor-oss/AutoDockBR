<div class="login-page">
  <div class="login-card">
    <h1 class="login-title" data-cy="loginTitle">AutoDockBR</h1>

    <div class="alert alert-danger login-error" *ngIf="authenticationError" data-cy="loginError">
      <strong>Erro de autenticação!</strong> Por favor verifique suas credenciais e tente novamente.
    </div>

    <form class="login-form" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="login-field">
        <label class="login-label" for="username">Endereço de e-mail</label>
        <input
          type="email"
          class="login-input"
          name="username"
          id="username"
          placeholder="joao_silva@email.com"
          formControlName="username"
          #username
          data-cy="username"
        />
      </div>

      <div class="login-field">
        <label class="login-label" for="password">Senha</label>
        <input
          type="password"
          class="login-input"
          name="password"
          id="password"
          placeholder="Sua senha"
          formControlName="password"
          data-cy="password"
        />
      </div>

      <div class="login-remember">
        <label for="rememberMe" class="login-remember-label">
          <input type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
          <span>Manter-me logado</span>
        </label>
      </div>

      <button type="submit" class="login-button" data-cy="submit">Entrar</button>
    </form>

    <div class="login-links">
      <a routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector">Esqueceu sua senha?</a>
      <a routerLink="/account/register">Não possui conta? Cadastre-se</a>
    </div>
  </div>
</div>
