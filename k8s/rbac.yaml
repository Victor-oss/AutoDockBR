apiVersion: v1
kind: ServiceAccount
metadata:
  name: autodock-job
  namespace: autodock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-creator
  namespace: autodock
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autodock-configmap-binding
  namespace: autodock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-creator
subjects:
- kind: ServiceAccount
  name: autodock-job
  namespace: autodock
